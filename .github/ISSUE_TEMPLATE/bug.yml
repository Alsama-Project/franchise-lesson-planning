name: Bug
description: Something in the app isn't working as it should.
title: "[BG-xx] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        This repository is public. If the problem could let someone see or change data they shouldn't,
        don't describe it here — tell the Beneficent team directly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
  - type: dropdown
    id: language
    attributes:
      label: English or Arabic interface
      options:
        - English
        - Arabic
        - Both
        - Not recorded
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. school laptop, Chrome / Android phone"
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Blur any personal details.
  - type: input
    id: related-story
    attributes:
      label: Related story
      placeholder: "e.g. #123 (US-5.3)"
